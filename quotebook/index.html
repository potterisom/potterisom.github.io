  <style>

    .control { align-self:end; justify-self:end; border:1px solid rgba(241,238,230,.2); width:104px; height:104px; border-radius:50%; background:var(--ink); color:var(--paper); cursor:pointer; font:500 10px/1 "DM Mono",monospace; letter-spacing:.07em; text-transform:uppercase; transition:transform .4s cubic-bezier(.16,1,.3,1), background .25s; position:relative; overflow:hidden; }
    .control::after { content:"↗"; display:block; font-family:"Instrument Serif",Georgia,serif; font-size:26px; font-weight:400; margin-top:5px; transition:transform .45s cubic-bezier(.16,1,.3,1); }
    .control:hover { background:var(--lime); color:#111412; transform:scale(1.07); }
    .control:hover::after { transform:translate(4px,-4px) rotate(-8deg); }

    footer { padding-top:18px; border-top:1px solid var(--rule); color:var(--muted); }
    .counter { color:var(--ink); }

    @media (max-width:650px) { .frame { padding:18px; } main { grid-template-columns:1fr; padding:64px 0 48px; } .control { width:86px; height:86px; justify-self:start; margin-top:20px; } .edition { display:none; } .quote { font-size:clamp(35px,10vw,54px); line-height:1.04; } .meta { margin-top:22px; } }

    const quoteEl = document.getElementById('quote'), byEl = document.getElementById('by'), dateEl = document.getElementById('date'), noteEl = document.getElementById('note'), card = document.getElementById('quote-card'), button = document.getElementById('new-quote'), counter = document.getElementById('counter');
